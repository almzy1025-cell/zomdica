name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder missing — generating..."
            flutter create . --platforms=android --org com.zomedica --project-name zomedica_radar
          else
            echo "Android folder already exists."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyze (non-blocking)
        run: flutter analyze || true

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zomedica-radar-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
